{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-page">
    <h1>500 - Server Error</h1>
    <p>Something went wrong on the server. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>

<style>
.error-page {
    text-align: center;
    padding: 60px 20px;
}

.error-page h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    color: #2d3748;
}

.error-page p {
    margin-bottom: 24px;
    color: #4a5568;
    font-size: 1.1rem;
}
</style>
{% endblock %}
